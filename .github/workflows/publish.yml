name: publish
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
    steps:
      - if: env.AZURE_STORAGE_KEY == ''
        run: echo "::notice::AZURE_STORAGE_KEY secret not set, skipping publish"
      - if: env.AZURE_STORAGE_KEY != ''
        uses: actions/checkout@v4
      - if: env.AZURE_STORAGE_KEY != ''
        uses: astral-sh/setup-uv@v6
      - if: env.AZURE_STORAGE_KEY != ''
        run: uv sync
      - if: env.AZURE_STORAGE_KEY != ''
        run: ./publish.sh
