name: publish
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

# one publish at a time: a manual run and the hourly one must not upload over each other
concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - if: env.AZURE_STORAGE_KEY == ''
        run: echo "::notice::AZURE_STORAGE_KEY secret not set, skipping publish"
      - if: env.AZURE_STORAGE_KEY != ''
        uses: actions/checkout@v4
      - if: env.AZURE_STORAGE_KEY != ''
        uses: astral-sh/setup-uv@v6
      - if: env.AZURE_STORAGE_KEY != ''
        run: uv sync
      # Bronze files never change once written, so keep them between runs (GitHub drops the oldest caches by itself)
      - if: env.AZURE_STORAGE_KEY != ''
        uses: actions/cache@v4
        with:
          path: data/bronze
          key: bronze-${{ github.run_id }}
          restore-keys: bronze-
      - if: env.AZURE_STORAGE_KEY != ''
        run: ./publish.sh
      # Same page on lakehouse.jwds.me (shared hosting with a free certificate). Azure stays the source.
      - if: env.AZURE_STORAGE_KEY != '' && env.FTP_PASSWORD != ''
        run: |
          for f in index.html lines.json .htaccess; do
            curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" -T "site/$f" "ftp://$FTP_HOST/$f"
          done
          # the live page must now carry this run's data (retry: the host can take a few seconds)
          want=$(grep -o '"updated":"[^"]*"' site/index.html | head -1)
          for i in 1 2 3 4 5; do
            curl -sfL "https://lakehouse.jwds.me/?$RANDOM" | grep -qF "$want" && { echo "live: $want"; exit 0; }
            sleep 10
          done
          echo "::error::lakehouse.jwds.me does not show $want"; exit 1
